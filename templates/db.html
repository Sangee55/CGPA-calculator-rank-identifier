<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Data Management</title>
    <style>
        :root {
            --primary: #2563eb;
            --background: #f8fafc;
            --text: #1e293b;
            --border: #e2e8f0;
            --hover: #f1f5f9;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 2rem;
        }

        h1, h2 {
            color: var(--primary);
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin: 1rem 0;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        th {
            background: var(--primary);
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            padding: 1rem;
            text-align: left;
            font-size: 0.875rem;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }

        tbody tr:hover {
            background: var(--hover);
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text);
            font-style: italic;
        }

        .error {
            color: #dc2626;
            text-align: center;
            padding: 1rem;
            background: #fee2e2;
            border-radius: 6px;
            margin: 1rem 0;
        }

        .empty-message {
            text-align: center;
            color: var(--text);
            font-style: italic;
            padding: 1rem;
        }

        form {
            margin-top: 2rem;
            text-align: center;
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        input, button {
            padding: 0.8rem;
            margin: 0.5rem;
            font-size: 1rem;
        }

        input {
            width: 200px;
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/sql.js@1.3.0/dist/sql-wasm.js"></script>
    <script>
        // Function to load and display data from SQLite
        function loadSQLiteData(url) {
            const tableBody = document.getElementById('sqliteTable').getElementsByTagName('tbody')[0];
            const permanentTableBody = document.getElementById('permanentTable').getElementsByTagName('tbody')[0];
            
            tableBody.innerHTML = '<tr><td colspan="2" class="loading">Loading data...</td></tr>'; // Show loading message

            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.arrayBuffer();
                })
                .then(fileBuffer => {
                    initSqlJs({ locateFile: file => `https://cdn.jsdelivr.net/npm/sql.js@1.3.0/dist/${file}` }).then(SQL => {
                        const db = new SQL.Database(new Uint8Array(fileBuffer));
                        const stmt = db.prepare("SELECT * FROM student_marks1");
                        tableBody.innerHTML = ''; // Clear loading message

                        let students = JSON.parse(localStorage.getItem('student_data') || '[]');
                        let newStudentsAdded = false;

                        while (stmt.step()) {
                            const row = stmt.getAsObject();
                            const newRow = tableBody.insertRow();
                            const regNumberCell = newRow.insertCell(0);
                            const marksCell = newRow.insertCell(1);
                            regNumberCell.textContent = row.reg_number;
                            marksCell.textContent = row.marks;

                            // Check if student already exists in permanent storage
                            const existingStudentIndex = students.findIndex(
                                student => student.registration_number === row.reg_number
                            );

                            if (existingStudentIndex === -1) {
                                // Add new student if not already in storage
                                students.push({
                                    registration_number: row.reg_number,
                                    average_marks: row.marks
                                });
                                newStudentsAdded = true;
                            }
                        }

                        // Save updated students list if new students were added
                        if (newStudentsAdded) {
                            localStorage.setItem('student_data', JSON.stringify(students));
                        }

                        // Render permanent data
                        renderPermanentData();

                        stmt.free();
                    }).catch(err => {
                        console.error('Error initializing sql.js:', err);
                        tableBody.innerHTML = '<tr><td colspan="2" class="error">Error loading SQLite data.</td></tr>';
                    });
                })
                .catch(err => {
                    console.error('Error fetching the SQLite file:', err);
                    tableBody.innerHTML = '<tr><td colspan="2" class="error">Error fetching the SQLite file.</td></tr>';
                });
        }

        // Function to render permanent data from localStorage
        function renderPermanentData() {
            const tableBody = document.getElementById('permanentTable').getElementsByTagName('tbody')[0];
            tableBody.innerHTML = ''; // Clear existing rows

            const storedData = localStorage.getItem('student_data');
            let students = storedData ? JSON.parse(storedData) : [];

            if (students.length === 0) {
                const emptyRow = tableBody.insertRow();
                const emptyCell = emptyRow.insertCell(0);
                emptyCell.colSpan = 2;
                emptyCell.className = 'empty-message';
                emptyCell.textContent = 'No permanent data found.';
                return;
            }

            students.sort((a, b) => a.registration_number.localeCompare(b.registration_number));

            students.forEach(student => {
                const newRow = tableBody.insertRow();
                const regNumberCell = newRow.insertCell(0);
                const marksCell = newRow.insertCell(1);

                regNumberCell.textContent = student.registration_number;
                marksCell.textContent = student.average_marks;

                // Add Edit and Delete buttons
                const actionsCell = newRow.insertCell(2);
                const editButton = document.createElement('button');
                editButton.textContent = 'Edit';
                editButton.onclick = () => editStudent(student.registration_number);
                const deleteButton = document.createElement('button');
                deleteButton.textContent = 'Delete';
                deleteButton.onclick = () => deleteStudent(student.registration_number);
                actionsCell.appendChild(editButton);
                actionsCell.appendChild(deleteButton);
            });
        }

        // Function to add a new student to localStorage and the permanent table
        function addStudent() {
            const regNumber = document.getElementById('regNumber').value;
            const marks = document.getElementById('marks').value;

            if (!regNumber || !marks) {
                alert('Please provide both registration number and marks');
                return;
            }

            const students = JSON.parse(localStorage.getItem('student_data') || '[]');
            const existingStudentIndex = students.findIndex(student => student.registration_number === regNumber);

            if (existingStudentIndex === -1) {
                students.push({
                    registration_number: regNumber,
                    average_marks: marks
                });
                localStorage.setItem('student_data', JSON.stringify(students));
                renderPermanentData();
            } else {
                alert('Student with this registration number already exists.');
            }

            // Clear form fields
            document.getElementById('regNumber').value = '';
            document.getElementById('marks').value = '';
        }

        // Function to edit an existing student
        function editStudent(regNumber) {
            const students = JSON.parse(localStorage.getItem('student_data') || '[]');
            const studentIndex = students.findIndex(student => student.registration_number === regNumber);

            if (studentIndex !== -1) {
                const newMarks = prompt('Enter new marks for student ' + regNumber);
                if (newMarks) {
                    students[studentIndex].average_marks = newMarks;
                    localStorage.setItem('student_data', JSON.stringify(students));
                    renderPermanentData();
                }
            }
        }

        // Function to delete a student from localStorage
        function deleteStudent(regNumber) {
            const students = JSON.parse(localStorage.getItem('student_data') || '[]');
            const studentIndex = students.findIndex(student => student.registration_number === regNumber);

            if (studentIndex !== -1) {
                students.splice(studentIndex, 1);
                localStorage.setItem('student_data', JSON.stringify(students));
                renderPermanentData();
            }
        }

        window.onload = function () {
            loadSQLiteData('../student_marks.db');
            renderPermanentData();
        };
    </script>
</head>
<body>
    <h1>Student Data Management</h1>

    <h2>Temporary SQLite Data</h2>
    <table id="sqliteTable">
        <thead>
            <tr>
                <th>Reg Number</th>
                <th>Marks</th>
            </tr>
        </thead>
        <tbody>
            <!-- Temporary data will be inserted here -->
        </tbody>
    </table>

    <h2>Permanent Data Storage</h2>
    <table id="permanentTable">
        <thead>
            <tr>
                <th>Registration Number</th>
                <th>Average Marks</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- Permanent data will be inserted here -->
        </tbody>
    </table>

    <h2>Add or Edit Student</h2>
    <form onsubmit="event.preventDefault(); addStudent();">
        <input type="text" id="regNumber" placeholder="Registration Number" required>
        <input type="text" id="marks" placeholder="Marks" required>
        <button type="submit">Add Student</button>
    </form>
</body>
</html>
